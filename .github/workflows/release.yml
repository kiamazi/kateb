name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_name: kateb-linux
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            asset_name: kateb-linux-arm64
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            asset_name: kateb-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            asset_name: kateb-darwin-arm64
            os: macos-14

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Copy binary
        run: cp target/${{ matrix.target }}/release/kateb ${{ matrix.asset_name }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Generate checksums
        run: |
          {
            echo "{"
            first=true
            for dir in binaries/*/; do
              asset_name=$(basename "$dir")
              checksum=$(sha256sum "binaries/$asset_name/$asset_name" | awk '{print $1}')
              if [ "$first" = true ]; then
                first=false
              else
                echo ","
              fi
              printf '  "%s": "%s"' "$asset_name" "$checksum"
            done
            echo ""
            echo "}"
          } > checksums.json
          cat checksums.json

      - name: Prepare binaries for upload
        run: |
          for dir in binaries/*/; do
            asset_name=$(basename "$dir")
            cp "binaries/$asset_name/$asset_name" .
          done
          ls -la kateb*

      - name: Upload binaries and checksums to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kateb-linux
            kateb-linux-arm64
            kateb-darwin
            kateb-darwin-arm64
            checksums.json
